name: reminders
on:
  schedule:
    - cron: '0 6 * * *'   # 9:00 AM Saudi time
  workflow_dispatch:       # manual run sends a test message too
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 nodemailer@6
      - run: node scripts/remind.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST: ${{ github.event_name == 'workflow_dispatch' }}
          MILEAGE_DAY: '5'   # 0 Sun ... 5 Fri ... 6 Sat
