name: reminders
on:
  schedule:
    - cron: '0 6 * * *'   # 9:00 صباحاً بتوقيت السعودية
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12
      - run: node scripts/remind.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MILEAGE_DAY: '5'   # يوم تذكير الممشى الأسبوعي: 0 الأحد ... 5 الجمعة ... 6 السبت
