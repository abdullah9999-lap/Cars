<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سيارات العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#16221f;--mute:#667873;--line:#dde5e2;--brand:#0f5c4d;--ok:#1b8a5a;--warn:#c27803;--bad:#c62f2f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;margin-inline-start:6px}
main{max-width:900px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.car{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.car:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7cc4b2;outline-offset:2px}
.car h3{margin:0;font-size:18px}.car small{color:var(--mute)}
.odo{font-size:26px;font-weight:700;margin:8px 0 2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.warn{color:var(--warn);border-color:var(--warn);background:#fff7e6}.chip.bad{color:var(--bad);border-color:var(--bad);background:#fdecec}
.add{width:100%;border:2px dashed var(--line);background:transparent;border-radius:12px;min-height:110px;font:inherit;color:var(--brand);cursor:pointer}
.box{max-width:380px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;margin-top:12px}
.btn.alt{background:#e8efed;color:var(--brand)}.btn.del{background:#fdecec;color:var(--bad)}
dialog{border:0;border-radius:14px;width:min(560px,94vw);padding:18px;max-height:90vh}
dialog::backdrop{background:rgba(10,30,25,.45)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.log img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer}
.log b{display:block}.log span{color:var(--mute);font-size:14px}
h4{margin:18px 0 4px}.err{color:var(--bad);font-size:14px;min-height:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== ضع إعدادات Firebase هنا =====
const firebaseConfig = {
  apiKey: "AIzaSyCKICk7PgdhIJlDyyCq5TdZv0FQE7dr2yQ",
  authDomain: "our-car-db30e.firebaseapp.com",
  projectId: "our-car-db30e",
  storageBucket: "our-car-db30e.firebasestorage.app",
  messagingSenderId: "552329465529",
  appId: "1:552329465529:web:27da3be3a236a699d1d568"
};
// ===================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES = ['تغيير زيت','فلتر','فرامل','إطارات','بطارية','فحص دوري','أخرى'];
const days = d => d ? Math.ceil((new Date(d) - new Date().setHours(0,0,0,0)) / 864e5) : null;
const chip = (name, n) => n === null ? '' :
  `<span class="chip ${n < 0 ? 'bad' : n <= 30 ? 'warn' : 'ok'}">${name}: ${n < 0 ? 'منتهي منذ ' + -n + ' يوم' : 'باقي ' + n + ' يوم'}</span>`;

if (!firebaseConfig.apiKey) {
  $('#app').innerHTML = '<div class="box"><h2>الموقع جاهز</h2><p>الصق إعدادات Firebase داخل المتغير <b>firebaseConfig</b> في أعلى الملف، ثم أعد التحميل.</p></div>';
} else start();

function start() {
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(), db = firebase.firestore();
  let user = null, cars = [], profile = {};

  auth.onAuthStateChanged(async u => {
    user = u;
    if (!u) return loginView();
    const p = await db.collection('users').doc(u.uid).get();
    profile = p.exists ? p.data() : {};
    db.collection('cars').onSnapshot(s => { cars = s.docs.map(d => ({id: d.id, ...d.data()})); home(); });
  });

  function loginView(msg = '') {
    $('#app').innerHTML = `<div class="box"><h2>سيارات العائلة</h2>
      <label>الاسم (للتسجيل الجديد)</label><input id="nm">
      <label>الإيميل</label><input id="em" type="email" dir="ltr">
      <label>كلمة المرور</label><input id="pw" type="password" dir="ltr">
      <div class="err" id="er">${esc(msg)}</div>
      <button class="btn" id="in">دخول</button> <button class="btn alt" id="up">حساب جديد</button></div>`;
    const fail = e => $('#er').textContent = 'تعذر الدخول: تحقق من الإيميل وكلمة المرور (٦ أحرف على الأقل)';
    $('#in').onclick = () => auth.signInWithEmailAndPassword($('#em').value, $('#pw').value).catch(fail);
    $('#up').onclick = () => auth.createUserWithEmailAndPassword($('#em').value, $('#pw').value)
      .then(c => db.collection('users').doc(c.user.uid).set({name: $('#nm').value, email: $('#em').value}, {merge: true}))
      .catch(fail);
  }

  function carCard(c) {
    const left = c.nextServiceKm ? c.nextServiceKm - c.odo : null;
    const pct = left === null ? 0 : Math.max(0, Math.min(100, 100 - left / (c.interval || 5000) * 100));
    const sv = left === null ? '' : `<span class="chip ${left < 0 ? 'bad' : left <= 500 ? 'warn' : 'ok'}">الصيانة: ${left < 0 ? 'متأخرة ' + -left : 'باقي ' + left} كم</span>`;
    return `<div class="car" tabindex="0" role="button" data-id="${c.id}">
      <h3>${esc(c.make)} ${esc(c.model)} ${esc(c.year)}</h3><small>${esc(c.plate)} · ${esc(c.ownerName)}</small>
      <div class="odo">${Number(c.odo || 0).toLocaleString('ar-SA-u-nu-latn')} كم</div>
      <div class="bar"><i style="width:${pct}%;background:${left !== null && left < 0 ? 'var(--bad)' : pct > 85 ? 'var(--warn)' : 'var(--ok)'}"></i></div>
      <div class="chips">${chip('الاستمارة', days(c.regExp))}${chip('التأمين', days(c.insExp))}${sv}</div></div>`;
  }

  function home() {
    $('#app').innerHTML = `<header><h1>سيارات العائلة</h1><div><button id="st">إعدادات التنبيه</button><button id="out">خروج</button></div></header>
      <main><div class="grid">${cars.map(carCard).join('')}<button class="add" id="ad">+ إضافة سيارة</button></div></main>`;
    document.querySelectorAll('.car').forEach(el => {
      el.onclick = () => carView(el.dataset.id);
      el.onkeydown = e => e.key === 'Enter' && carView(el.dataset.id);
    });
    $('#ad').onclick = addCar; $('#out').onclick = () => auth.signOut(); $('#st').onclick = settings;
  }

  function open(html) { const d = $('#dlg'); d.innerHTML = html; if (!d.open) d.showModal(); return d; }
  const closeBtn = '<button class="btn alt" onclick="document.getElementById(\'dlg\').close()">إغلاق</button>';

  function addCar() {
    const d = open(`<h3>إضافة سيارة</h3><div class="row">
      <div><label>النوع</label><input id="mk" placeholder="تويوتا"></div><div><label>الموديل</label><input id="md" placeholder="كامري"></div>
      <div><label>السنة</label><input id="yr" type="number"></div><div><label>رقم اللوحة</label><input id="pl"></div>
      <div><label>الممشى الحالي (كم)</label><input id="od" type="number"></div><div><label>الصيانة كل (كم)</label><input id="iv" type="number" value="5000"></div>
      <div><label>انتهاء الاستمارة</label><input id="rg" type="date"></div><div><label>انتهاء التأمين</label><input id="is" type="date"></div></div>
      <button class="btn" id="sv">حفظ</button> ${closeBtn}`);
    d.querySelector('#sv').onclick = async () => {
      const g = i => d.querySelector(i).value;
      const od = +g('#od') || 0, iv = +g('#iv') || 5000;
      await db.collection('cars').add({make: g('#mk'), model: g('#md'), year: g('#yr'), plate: g('#pl'), odo: od, interval: iv,
        nextServiceKm: od + iv, regExp: g('#rg'), insExp: g('#is'), ownerId: user.uid, ownerName: profile.name || user.email,
        created: Date.now()});
      d.close();
    };
  }

  async function carView(id) {
    const c = cars.find(x => x.id === id); if (!c) return;
    const mine = c.ownerId === user.uid;
    const d = open(`<h3>${esc(c.make)} ${esc(c.model)} · ${esc(c.plate)}</h3>
      <div class="row"><div><label>الممشى (كم)</label><input id="od" type="number" value="${c.odo || 0}"></div>
      <div><label>الصيانة كل (كم)</label><input id="iv" type="number" value="${c.interval || 5000}"></div>
      <div><label>انتهاء الاستمارة</label><input id="rg" type="date" value="${c.regExp || ''}"></div>
      <div><label>انتهاء التأمين</label><input id="is" type="date" value="${c.insExp || ''}"></div></div>
      <button class="btn" id="sv">حفظ البيانات</button>
      <h4>إضافة صيانة</h4><div class="row">
      <div><label>النوع</label><select id="lt">${TYPES.map(t => `<option>${t}</option>`).join('')}</select></div>
      <div><label>التاريخ</label><input id="ld" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
      <div><label>الممشى (كم)</label><input id="lk" type="number" value="${c.odo || 0}"></div>
      <div><label>التكلفة (ريال)</label><input id="lc" type="number"></div></div>
      <label>ملاحظة</label><input id="ln"><label>صورة الفاتورة</label><input id="lp" type="file" accept="image/*" capture="environment">
      <div class="err" id="er"></div><button class="btn" id="al">إضافة للسجل</button>
      <h4>السجل</h4><div id="logs">جاري التحميل…</div><p>${closeBtn} ${mine ? '<button class="btn del" id="dc">حذف السيارة</button>' : ''}</p>`);
    const ref = db.collection('cars').doc(id), g = i => d.querySelector(i).value;

    d.querySelector('#sv').onclick = async () => {
      const od = +g('#od') || 0, iv = +g('#iv') || 5000;
      await ref.update({odo: od, interval: iv, regExp: g('#rg'), insExp: g('#is')});
      d.close();
    };
    d.querySelector('#al').onclick = async () => {
      try {
        const f = d.querySelector('#lp').files[0], km = +g('#lk') || 0;
        await ref.collection('logs').add({type: g('#lt'), date: g('#ld'), km, cost: +g('#lc') || 0, note: g('#ln'),
          photo: f ? await shrink(f) : '', by: profile.name || user.email, ts: Date.now()});
        const up = {odo: Math.max(km, c.odo || 0)};
        if (g('#lt') === 'تغيير زيت') up.nextServiceKm = km + (+g('#iv') || 5000);
        await ref.update(up); d.close();
      } catch (e) { d.querySelector('#er').textContent = 'تعذر الحفظ، تحقق من الاتصال وصلاحيات Firestore'; }
    };
    if (mine) d.querySelector('#dc').onclick = async () => { if (confirm('حذف السيارة نهائياً؟')) { await ref.delete(); d.close(); } };

    const s = await ref.collection('logs').orderBy('ts', 'desc').get();
    d.querySelector('#logs').innerHTML = s.empty ? 'ما فيه صيانات مسجلة بعد' : s.docs.map(x => x.data()).map(l =>
      `<div class="log">${l.photo ? `<img src="${l.photo}" alt="فاتورة" onclick="window.open(this.src)">` : ''}
       <div><b>${esc(l.type)} · ${l.cost} ريال</b><span>${esc(l.date)} · ${l.km} كم · ${esc(l.by)}</span><span>${esc(l.note)}</span></div></div>`).join('');
  }

  // ضغط الصورة داخل المتصفح (حتى ~100KB) لتخزينها في Firestore بدون Storage
  function shrink(file) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = img.width * k; cv.height = img.height * k;
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', .6));
      };
      img.onerror = rej; img.src = URL.createObjectURL(file);
    });
  }

  function settings() {
    const d = open(`<h3>إعدادات التنبيه</h3>
      <label>رقم الواتساب (مع رمز الدولة، مثال 9665xxxxxxxx)</label><input id="ph" dir="ltr" value="${esc(profile.phone)}">
      <label>مفتاح CallMeBot</label><input id="ak" dir="ltr" value="${esc(profile.apikey)}">
      <p style="color:var(--mute);font-size:14px">كل شخص يفعّل رقمه مرة واحدة من موقع callmebot.com ويحصل على مفتاحه.</p>
      <button class="btn" id="sv">حفظ</button> ${closeBtn}`);
    d.querySelector('#sv').onclick = async () => {
      profile = {...profile, phone: d.querySelector('#ph').value.trim(), apikey: d.querySelector('#ak').value.trim()};
      await db.collection('users').doc(user.uid).set(profile, {merge: true}); d.close();
    };
  }
}
</script>
</body>
</html>
